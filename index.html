<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valbury Makassar - Lowongan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;font-size:16px;line-height:1.7;color:#1E2A47}
#cover{position:relative;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white;padding:20px;overflow:hidden}
#cover video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2}
#cover .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.35);z-index:-1}
#cover h1{font-family:'Playfair Display',serif;font-size:3rem;z-index:1;text-shadow:0 4px 20px rgba(0,0,0,0.9)}#cover h1 span{color:#D4AF37}
.btn-buka{margin-top:25px;padding:16px 40px;background:#D4AF37;color:#0A1F1A;border:none;border-radius:50px;font-weight:700;cursor:pointer;z-index:1}
#content{display:none;max-width:800px;margin:0 auto;padding:30px 20px}
.card{background:white;padding:30px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.12);margin-bottom:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
label{font-weight:600;font-size:15px;margin-top:15px;display:block}
input,select,textarea{width:100%;padding:14px;margin-top:8px;border:2px solid #E5E7EB;border-radius:10px;font-size:15px}
button.submit{width:100%;padding:16px;margin-top:18px;background:#0A1F1A;color:#D4AF37;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:16px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="cover">
  <video autoplay muted loop playsinline><source src="lv_0_20261112093237.mp4" type="video/mp4"></video>
  <div class="overlay"></div>
  <h1>PT VALBURY <span>MAKASSAR</span></h1>
  <p style="z-index:1;max-width:600px;margin-top:10px">Pialang Berjangka Legal BAPPEBTI Sejak 2003</p>
  <button class="btn-buka" onclick="document.getElementById('cover').style.display='none';document.getElementById('content').style.display='block';window.scrollTo(0,0)">Lihat Lowongan</button>
</div>

<div id="content">
  <div class="card">
    <h2>Form Lamaran Online</h2>
    <form id="formKerja">
      <input type="hidden" name="id" value="valbury-mks-nov2026">
      <label>Nama Lengkap *</label><input type="text" name="nama" required placeholder="Andi Pratama">
      <div class="grid2">
        <div><label>Gender *</label><select name="gender" required><option value="">-- Pilih --</option><option value="Pria">Pria</option><option value="Wanita">Wanita</option></select></div>
        <div><label>Usia</label><input type="number" name="usia" placeholder="25"></div>
      </div>
      <label>Email *</label><input type="email" name="email" required placeholder="andi@gmail.com">
      <label>Nomor WA / Telp *</label><input type="text" name="no_telp" required placeholder="+62 812 xxxx">
      <label>Domisili *</label><input type="text" name="domisili" required placeholder="Makassar">
      <label>Catatan / Pengalaman</label><textarea name="catatan" rows="4" placeholder="Pengalaman kerja..."></textarea>
      <button type="submit" class="submit">Kirim Lamaran</button>
      <p id="msg" style="text-align:center;margin-top:15px;font-weight:600"></p>
    </form>
  </div>
</div>

<script>
document.getElementById('formKerja').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  document.getElementById('msg').innerText = "Mengirim lamaran...";
  
  // GANTI URL INI DENGAN URL DEPLOY BARU KAMU
  const API_URL = "https://script.google.com/macros/s/AKfycbw7TA2hWLKvKNo-6p6RYNJfrb_BwTf9dJe_k1Zg2TqueIynvbpWHAf06NB-RYsy4670kg/exec";
  
  try{
    await fetch(API_URL, {method:'POST', mode:'no-cors', body: JSON.stringify(data)});
    document.getElementById('msg').innerText = "✅ Lamaran terkirim! Mengalihkan ke WA...";
    
    // ===== AUTO NOTIF WA KE NOVI =====
    const noAdmin = "6281944459643"; // Nomor Novi (tanpa +)
    const pesanWa = 
`🔥 LAMARAN BARU VALBURY MAKASSAR

Nama: ${data.nama}
Gender: ${data.gender}
Usia: ${data.usia}
Email: ${data.email}
WA: ${data.no_telp}
Domisili: ${data.domisili}
Catatan: ${data.catatan}

ID: ${data.id}
Source: Web Valbury Makassar`;

    const waUrl = "https://wa.me/" + noAdmin + "?text=" + encodeURIComponent(pesanWa);
    
    // Buka WA di tab baru
    setTimeout(()=>{
      window.open(waUrl, "_blank");
    }, 800);

    e.target.reset();
    
  }catch(err){
    document.getElementById('msg').innerText = "❌ Gagal mengirim: " + err;
    document.getElementById('msg').style.color="red";
  }
});
</script>
</body>
</html>
