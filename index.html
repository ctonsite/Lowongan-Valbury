<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valbury Makassar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif}
#cover{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white;position:relative;overflow:hidden;background:#000}
#cover video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
#cover .ov{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(10,31,26,0.7)}
#cover h1,#cover p,#cover button{position:relative;z-index:2}
#cover h1{font-family:Playfair Display,serif;font-size:3rem}#cover h1 span{color:#D4AF37}
.btn{margin-top:20px;padding:14px 32px;background:#D4AF37;border:none;border-radius:50px;font-weight:700;cursor:pointer}
#content{display:none;max-width:800px;margin:0 auto;padding:30px 20px}.card{background:white;padding:30px;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1);margin-bottom:20px}
label{font-weight:600;margin-top:12px;display:block}input,select,textarea{width:100%;padding:12px;margin-top:6px;border:2px solid #ddd;border-radius:8px}
button.submit{width:100%;padding:14px;margin-top:15px;background:#0A1F1A;color:#D4AF37;border:none;border-radius:8px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="cover">
<video autoplay muted loop playsinline><source src="lv_0_20261112093237.mp4" type="video/mp4"></video>
<div class="ov"></div>
<h1>PT VALBURY <span>MAKASSAR</span></h1>
<p>Legal BAPPEBTI Sejak 2003</p>
<button class="btn" onclick="document.getElementById('cover').style.display='none';document.getElementById('content').style.display='block'">Lihat Lowongan</button>
</div>
<div id="content">
<div class="card">
<h2>Form Lamaran Online</h2>
<form id="formKerja">
<input type="hidden" name="id" value="valbury-mks">
<label>Nama Lengkap *</label><input type="text" name="nama" required>
<label>Gender *</label><select name="gender" required><option value="">Pilih</option><option>Pria</option><option>Wanita</option></select>
<label>Usia</label><input type="number" name="usia">
<label>Email *</label><input type="email" name="email" required>
<label>No WA *</label><input type="text" name="no_telp" required>
<label>Domisili *</label><input type="text" name="domisili" required>
<label>Catatan</label><textarea name="catatan" rows="3"></textarea>
<button type="submit" class="submit">Kirim Lamaran</button>
<p id="msg" style="text-align:center;margin-top:10px;font-weight:600"></p>
</form>
</div>
</div>
<script>
document.getElementById('formKerja').addEventListener('submit', async (e)=>{
e.preventDefault();
const data = Object.fromEntries(new FormData(e.target));
const msg = document.getElementById('msg');
msg.innerText="Mengirim...";
const API_URL="https://script.google.com/macros/s/AKfycbwGCkqERU_d3J0r6qvzXgVsWDGeIyNnqLN9Yjevlg79/exec";
try{
await fetch(API_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(data)});
msg.innerText="✅ Lamaran terkirim!"; msg.style.color="green"; e.target.reset();
}catch{msg.innerText="❌ Gagal"; msg.style.color="red";}
});
</script>
</body>
</html>
